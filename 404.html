<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>CampusMarket | جاري التحويل...</title>
    <script type="text/javascript">
      // GitHub Pages SPA router: redirects non-hash direct paths to hash routes
      (function() {
        var pathname = window.location.pathname;
        var repoName = '/campus-market';
        var subPath = pathname;
        if (pathname.indexOf(repoName) === 0) {
          subPath = pathname.substring(repoName.length);
        }
        if (!subPath || subPath === '/') {
          subPath = '';
        }
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // If subPath starts with a slash, strip it for hash route consistency
        if (subPath.charAt(0) !== '/' && subPath.length > 0) {
          subPath = '/' + subPath;
        }

        var redirectUrl = window.location.protocol + '//' + window.location.host + repoName + '/#' + subPath + search + hash;
        window.location.replace(redirectUrl);
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #F8FAFC; color: #18343B;">
    <h2>جاري التحويل إلى صفحة CampusMarket...</h2>
    <p>إذا لم يتم تحويلك تلقائياً، <a id="fallback-link" href="/campus-market/#/" style="color: #087E83; font-weight: bold;">اضغط هنا</a></p>
    <script type="text/javascript">
      try {
        var repoName = '/campus-market';
        var p = window.location.pathname.replace(repoName, '');
        document.getElementById('fallback-link').href = repoName + '/#' + p + window.location.search + window.location.hash;
      } catch(e) {}
    </script>
  </body>
</html>
